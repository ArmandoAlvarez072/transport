services:
  postgres:
    image: postgres:16-alpine
    container_name: transport-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: transport_user
      POSTGRES_PASSWORD: transport_pass
    ports:
      - "5433:5432"
    volumes:
      - transport_pg_data:/var/lib/postgresql/data

volumes:
  transport_pg_data:
